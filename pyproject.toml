[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1"
description = "RAG composition layer for document ingestion, context construction, and retrieval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Scot P. Floess", email = "sfloess@gmail.com" },
]
dependencies = [
    "chunking @ git+https://github.com/FlossWare/chunking.git",
    "storage @ git+https://github.com/FlossWare/storage.git",
    "retrieval @ git+https://github.com/FlossWare/retrieval.git",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "bandit"]

[project.urls]
Homepage = "https://github.com/FlossWare/rag"
Repository = "https://github.com/FlossWare/rag"
Issues = "https://github.com/FlossWare/rag/issues"

[tool.setuptools.packages.find]
include = ["rag_ai*"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
